[package]
name = "exp-gateway-native"
version = "0.3.181"
edition = "2021"
description = "Rust data plane for the Experiential local gateway (PoC), embedded as a PyO3 extension."
license = "Apache-2.0"
publish = false

[lib]
name = "exp_gateway_native"
crate-type = ["cdylib", "rlib"]

[features]
# `cargo test --no-default-features` links the unit-test binary against a
# host libpython; the shipped wheel keeps the extension-module link mode.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
http = "1"
httpdate = "1"
h2 = "0.4"
http-body-util = "0.1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
bytes = "1"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip", "arbitrary_precision"] }
indexmap = { version = "2", features = ["serde"] }
hashlink = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tiktoken-rs = { version = "0.12.1", default-features = false }
sha2 = "0.10"
ring = "0.17"
aws-config = "1.13"
aws-credential-types = "1.2"
aws-types = "1.3"
# Demux-only (no decoding): measures an uploaded audio file's duration from its
# codec frame lengths so a transcription reservation bounds what the provider meters.
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "ogg", "mkv", "isomp4", "mp3", "flac", "id3v2"] }
thiserror = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
regex-syntax = "0.8.11"
jsonschema = { version = "0.58.3", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

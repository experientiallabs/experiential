[project]
name = "world-model-optimizer"
version = "0.3.0"
description = "Build simulations and optimize model routing from agent traces."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Cross-platform advisory locking for durable registries edited in place. Declared directly
    # because `wmo.common.core.locks` imports it and Unix-only `fcntl` is not a portable boundary.
    "filelock>=3.12",
    "typer>=0.16",
    "click>=8.2",  # pins no_args_is_help semantics: help + usage-error exit 2 (<8.2 exited 0)
    "fastapi>=0.128",
    "uvicorn>=0.38",
    "pydantic>=2.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "rich>=14.1",
    "tomli-w>=1.0",  # writing project and telemetry TOML; every `wmo build` needs it
    "posthog>=7.0",
    # Public router request and response types follow the official OpenAI-generated schemas.
    "openai>=3.0,<4",
    # Bedrock uses the official AWS runtime client. Imports stay lazy inside the Bedrock adapter.
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
]

[project.optional-dependencies]
# Persisted supervised fine-tuning uses the native Tinker SDK and cookbook renderer surface.
sft = ["tinker>=0.23,<0.24", "tinker-cookbook>=0.4.3,<0.5"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    "world-model-optimizer[sft]",
]

[project.scripts]
wmo = "wmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmo"]
# Test-only code is named for pytest discovery, and `wmo/conftest.py` is a pytest fixture module.
exclude = ["**/*_test.py", "wmo/conftest.py"]

[tool.hatch.build.targets.sdist]
# One flagship distribution: everything importable lives under /wmo.
include = [
    "/wmo",
    "/assets",
    "/docs/reference/gateway-architecture.md",
    "/docs/release-scope.md",
    "/docs/usage.md",
    "/README.md",
    "/pyproject.toml",
    "/conftest.py",
]

[tool.pytest.ini_options]
# Tests live inline next to the modules they cover (foo.py -> foo_test.py).
python_files = ["*_test.py"]
# One root gate over the single package.
testpaths = ["wmo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE", "T20"]
extend-select = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test modules are fixtures and assertions rather than public package APIs. Production modules
# still require a module docstring and Google-style public API documentation.
"**/*_test.py" = ["D"]
[tool.ty.environment]
python-version = "3.12"

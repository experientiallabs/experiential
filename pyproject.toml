[project]
name = "world-model-optimizer"
version = "0.2.1"
description = "Run agents, build world models from traces, and optimize agent harnesses."
readme = "README.md"
# harbor 0.20.0 requires Python >=3.12; the harbor evaluator is a first-class optimize
# environment, so the whole package moves to 3.12 (deliberate 3.11 drop, noted in the PR body).
requires-python = ">=3.12"
dependencies = [
    # typer/rich/fastapi/uvicorn floors match harbor 0.20.0's requirements so the harbor
    # extra resolves against the core install without downgrades.
    "typer>=0.16",
    "click>=8.2",  # pins no_args_is_help semantics: help + usage-error exit 2 (<8.2 exited 0)
    "fastapi>=0.128",
    "uvicorn>=0.38",
    "pydantic>=2.6",
    "numpy>=1.26",
    # The routing optimizer's clustering stack (KMeans + Normalizer), matching the Avengers
    # reference implementation it replicates; serving only reads fitted centroids (numpy).
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "rich>=14.1",
    # The data-bundle read core behind `wmo download` (stdlib-only; pushing needs its own
    # `fetch` extra). Published separately to PyPI and resolved from there — its benchmark
    # adapters and capture tooling are not part of this repository.
    "environment-capture",
    "gepa>=0.1.1",
    "tomli-w>=1.0",  # writing .wmo/config.toml (stdlib tomllib reads); every `wmo build` needs it
    "posthog>=7.0",
    # Provider SDKs ship with the core install: a fresh `uv sync` must serve every provider the
    # wizard offers without a "No module named ..." follow-up step.
    "anthropic>=0.39",
    "openai>=1.40",
    "boto3>=1.34",
    "python-multipart>=0.0.9",  # FastAPI UploadFile for the build-your-own traces upload
]

[project.optional-dependencies]
otel = ["opentelemetry-proto>=1.24"]
# Plotting/figures for research runs (wmo research plot-concurrency); kept out of the core install.
# pandas backs the concurrency-scaling plot's tidy DataFrame.
viz = ["seaborn>=0.13", "matplotlib>=3.8", "pandas>=2.0"]
# The e2b harness backend (`--harness-backend e2b`): the pi-node harness PROCESS executes in
# pooled E2B microVMs while the environment stays the world model. Only those runs need it —
# local runs stay sandbox-free — so it is an optional extra imported lazily
# (wmo.harness.e2b_sandbox / wmo.harness.pi_e2b). Exact pin: the harbor E2B environment
# (wmo.evals.harbor.e2b_environment) depends on version-sensitive template-build API behavior
# and embeds the e2b version in template alias derivation.
e2b = ["e2b==2.31.0"]
# The harbor evaluator (`wmo.evals.harbor`): scores harness candidates on real
# Terminal-Bench-2-style tasks through the harbor runner. Imported lazily, same contract as
# the e2b extra. Exact pin: our E2B template alias derivation embeds harbor's version and
# tracks its build behavior. Running harbor task environments ON E2B additionally needs
# `wmo[harbor,e2b]` plus harbor's own e2b extra (`harbor[e2b]`, for dockerfile-parse).
harbor = ["harbor==0.20.0"]
# Context connectors (`wmo.connect`): the MCP client SDK backs the Notion connector's
# remote-MCP OAuth/pull path. Only that path needs it, so it is an optional extra imported
# lazily (wmo.connect.notion), same contract as the e2b extra above.
connectors = ["mcp>=1.27"]
# The Postgres trace source (`wmo ingest --source postgres`): the driver is imported lazily
# inside the adapter's pull path, same contract as the vendor-SDK extras.
postgres = ["psycopg[binary]>=3.1"]
# On-policy distillation (`wmo.distill` + the tinker provider): trains a LoRA student on
# Tinker from harbor rollouts. Imported lazily, same contract as the e2b extra. The cookbook
# pin tracks the 0.4.x renderer surface this integration was verified against; Tinker's model
# lineup churns, so base-model names live in run configs, never in code. The tinker pin tracks
# the 0.23.x exception surface llm-waterfall's classification trusts by name (classify.py).
# wandb is optional run tracking (lazy import, activated only via [wandb] enabled in the run config).
distill = ["tinker>=0.23,<0.24", "tinker-cookbook>=0.4.3,<0.5", "wandb>=0.17"]
# dev pulls in every backend SDK so `ty check` and the full test suite resolve over the whole
# project (the providers import anthropic/openai/boto3 lazily, but type-checking needs them present).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    "world-model-optimizer[otel,viz,e2b,connectors,harbor,postgres,distill]",
]

[dependency-groups]
# environment-capture is a published PyPI dependency (`wmo download` reads its data bundles);
# the dev group adds its heavy extras so the root gate can exercise the fetch/bedrock paths.
dev = ["environment-capture[bedrock,fetch]"]

[project.scripts]
wmo = "wmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmo"]
# Test-only code is named for pytest discovery (`*_test.py`), and these two are the exceptions
# that the glob therefore misses: `fake_tinker` is the deterministic Tinker double the distill
# tests run the whole loop against, and `wmo/conftest.py` is a pytest fixture module. Both are
# imported only by tests, so neither belongs in the published wheel. `fake_tinker` stays where
# it is rather than moving under a test path: five test modules import it by that name.
exclude = ["**/*_test.py", "wmo/distill/fake_tinker.py", "wmo/conftest.py"]
# The vendored waterfall utility keeps its own MIT notice beside the code it covers.
force-include = { "wmo/utils/waterfall/LICENSE" = "wmo/utils/waterfall/LICENSE" }

[tool.hatch.build.targets.sdist]
# One flagship distribution: everything importable lives under /wmo, and the
# environment-capture dependency resolves from PyPI.
include = [
    "/wmo",
    "/README.md",
    "/pyproject.toml",
    "/conftest.py",
]

[tool.pytest.ini_options]
# Tests live inline next to the modules they cover (foo.py -> foo_test.py).
python_files = ["*_test.py"]
# One root gate over the single package.
testpaths = ["wmo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE", "T20"]

[tool.ruff.lint.per-file-ignores]
# The waterfall utility's adapter tests stub provider SDK clients, whose kwargs are genuinely
# arbitrary — the fakes have to accept whatever the SDK signature accepts. Scoped to that one
# module tree so the rest of `wmo/` keeps ANN401 in full force.
"wmo/utils/waterfall/**/*_test.py" = ["ANN401"]

[tool.ty.environment]
python-version = "3.12"

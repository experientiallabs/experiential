[project]
name = "world-model-harness"
version = "0.1.0"
description = "Docker as an LLM: a frontier model acts as your agent's environment, reconstructed from OTel traces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "click>=8.2",  # pins no_args_is_help semantics: help + usage-error exit 2 (<8.2 exited 0)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "rich>=13.7",
    "gepa>=0.1.1",
    "tomli-w>=1.0",  # writing .wmh/config.toml (stdlib tomllib reads); every `wmh build` needs it
    "posthog>=7.0",
    # Provider SDKs ship with the core install: a fresh `uv sync` must serve every provider the
    # wizard offers without a "No module named ..." follow-up step.
    "anthropic>=0.39",
    "openai>=1.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
otel = ["opentelemetry-proto>=1.24"]
# Plotting/figures for research runs; kept out of the core install.
viz = ["seaborn>=0.13", "matplotlib>=3.8"]
dev = [
    # Workspace member: benchmark adapters + real-run trace capture (environment-capture/).
    "environment-capture[bedrock,fetch]",
    "pytest>=8.0",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    "world-model-harness[otel,viz]",
]

[project.scripts]
wmh = "wmh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmh"]

[tool.uv.workspace]
members = ["environment-capture"]

[tool.uv.sources]
environment-capture = { workspace = true }

[tool.pytest.ini_options]
# Tests live inline next to the modules they cover (foo.py -> foo_test.py).
python_files = ["*_test.py"]
testpaths = ["wmh", "environment-capture"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `examples/` holds isolated, self-contained task launch/capture helpers that can depend on their
# own benchmark environments. They are not part of the reusable `wmh` package.
# The three pre-contract benchmark dirs keep their examples-era exemption: their capture
# tooling is battle-tested stdlib scripting that predates the environment_capture package.
extend-exclude = [
    "examples/",
    ".agents/",
    "environment-capture/tau-bench/",
    "environment-capture/terminal-tasks/",
    "environment-capture/swe-bench/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# The appworld/gaia2 `backend/` scripts import heavy engines that live only in those
# benchmarks' local venvs (not project dependencies) — excluded like examples/.
exclude = [
    "examples/",
    ".agents/",
    "environment-capture/appworld/backend/",
    "environment-capture/gaia2/backend/",
    "environment-capture/tau-bench/",
    "environment-capture/terminal-tasks/",
    "environment-capture/swe-bench/",
]

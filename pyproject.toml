[project]
name = "world-model-optimizer"
version = "0.3.0"
description = "Build simulations and optimize model routing from agent traces."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Cross-platform advisory locking for durable registries edited in place. Declared directly
    # because `wmo.common.core.locks` imports it and Unix-only `fcntl` is not a portable boundary.
    "filelock>=3.12",
    "typer>=0.16",
    "click>=8.2",  # pins no_args_is_help semantics: help + usage-error exit 2 (<8.2 exited 0)
    "fastapi>=0.128",
    "uvicorn>=0.38",
    "pydantic>=2.6",
    "numpy>=1.26",
    # The routing optimizer's clustering stack (KMeans + Normalizer), matching the Avengers
    # reference implementation it replicates; serving only reads fitted centroids (numpy).
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "rich>=14.1",
    "tomli-w>=1.0",  # writing .wmo/config.toml (stdlib tomllib reads); every `wmo build` needs it
    "posthog>=7.0",
    # Provider SDKs ship with the core install: a fresh `uv sync` must serve every provider the
    # wizard offers without a "No module named ..." follow-up step.
    "anthropic>=0.39",
    "openai>=1.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
otel = ["opentelemetry-proto>=1.24"]
# Persisted supervised fine-tuning uses the native Tinker SDK and cookbook renderer surface.
sft = ["tinker>=0.23,<0.24", "tinker-cookbook>=0.4.3,<0.5"]
# The in-process local embedder (`wmo.common.providers.local_embed`, EmbedderKind.LOCAL): Qwen3
# embeddings with no embedding API in the loop. mlx-lm exists only on Apple silicon, hence the
# marker; it is imported via importlib there (a static import would break the type gate
# everywhere else), while torch/transformers install on every platform and stay static-lazy.
local = [
    "mlx-lm>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.4",
    "transformers>=4.51",
]
# dev pulls in every backend SDK so `ty check` and the full test suite resolve over the whole
# project (the providers import anthropic/openai/boto3 lazily, but type-checking needs them present).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    "world-model-optimizer[otel,sft,local]",
]

[dependency-groups]
# environment-capture joins the dev environment (uv syncs the `dev` group by default) with its
# heavy extras, so the root gate can exercise the tests that import it directly.
#
# A dependency GROUP is not published metadata, so nothing here reaches a `pip install
# world-model-optimizer`. That is the whole point for environment-capture: it is a development
# dependency only, and shipped `wmo/` imports nothing from it (`wmo/simulation/hub.py` vendors the
# bundle-fetch read core `wmo download` needs). llm-waterfall is no longer a dependency in any
# form: its source is vendored under `wmo/common/vendor/waterfall/` and ships inside the flagship wheel.
dev = ["environment-capture[bedrock,fetch]"]

[project.scripts]
wmo = "wmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmo"]
# Test-only code is named for pytest discovery, and `wmo/conftest.py` is a pytest fixture module.
exclude = ["**/*_test.py", "wmo/conftest.py"]
# The vendored waterfall utility's MIT notice at wmo/common/vendor/waterfall/LICENSE needs no
# force-include: `packages = ["wmo"]` already ships every non-Python file under wmo/.

[tool.hatch.build.targets.sdist]
# One flagship distribution: everything importable lives under /wmo, including the vendored
# waterfall utility. environment-capture is a dev-only dependency, never a `Requires-Dist`.
include = [
    "/wmo",
    "/README.md",
    "/pyproject.toml",
    "/conftest.py",
]

[tool.pytest.ini_options]
# Tests live inline next to the modules they cover (foo.py -> foo_test.py).
python_files = ["*_test.py"]
# One root gate over the single package.
testpaths = ["wmo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE", "T20"]
extend-select = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test modules are fixtures and assertions rather than public package APIs. Production modules
# still require a module docstring, and new public APIs must use the Google convention above.
"**/*_test.py" = ["D"]
# Exact public-docstring migration inventory frozen from W1's baseline. The corresponding
# symbol-level transition test rejects new violations in these legacy files, requires tombstones
# when a violation is fixed, and rejects a reintroduced tombstone. No directory is exempt.
"wmo/cli/defer.py" = ["D102"]
"wmo/common/config/card.py" = ["D103"]
"wmo/common/config/config.py" = ["D102"]
"wmo/common/config/settings.py" = ["D103"]
"wmo/common/config/store.py" = ["D102"]
"wmo/common/observability/clock.py" = ["D102"]
"wmo/common/observability/metered.py" = ["D102"]
"wmo/common/observability/reporting.py" = ["D102"]
"wmo/common/observability/telemetry.py" = ["D102", "D103"]
"wmo/common/observability/tracker.py" = ["D102"]
"wmo/common/providers/anthropic.py" = ["D102"]
"wmo/common/providers/azure_openai.py" = ["D102"]
"wmo/common/providers/base.py" = ["D102"]
"wmo/common/providers/bedrock.py" = ["D102"]
"wmo/common/providers/openai.py" = ["D102"]
"wmo/common/providers/pool.py" = ["D102"]
"wmo/common/providers/retry.py" = ["D102"]
"wmo/common/providers/waterfall.py" = ["D102"]
"wmo/common/vendor/waterfall/adapters/anthropic.py" = ["D102"]
"wmo/common/vendor/waterfall/adapters/aws_mantle.py" = ["D102"]
"wmo/common/vendor/waterfall/adapters/azure_openai.py" = ["D102"]
"wmo/common/vendor/waterfall/waterfall.py" = ["D102"]
"wmo/optimize/judge.py" = ["D102"]
"wmo/optimize/judge_quality.py" = ["D102"]
"wmo/optimize/numeric.py" = ["D102"]
"wmo/optimize/research/ablation.py" = ["D102"]
"wmo/optimize/research/concurrency_scaling.py" = ["D102"]
"wmo/optimize/research/gepa_scaling.py" = ["D102"]
"wmo/optimize/research/seed_stability.py" = ["D102"]
"wmo/optimize/research/trace_scaling.py" = ["D102"]
"wmo/runtime/platform/auth.py" = ["D102"]
"wmo/runtime/platform/client.py" = ["D102"]
"wmo/simulation/ingest/adapter.py" = ["D103"]
"wmo/simulation/ingest/base.py" = ["D102"]
"wmo/simulation/ingest/mastra.py" = ["D102"]
"wmo/simulation/ingest/messages.py" = ["D102"]
"wmo/simulation/ingest/normalize.py" = ["D103"]
"wmo/simulation/ingest/posthog.py" = ["D102"]
"wmo/simulation/scenarios/synthesis/scenario_set.py" = ["D102"]
"wmo/simulation/scenarios/verification/judge.py" = ["D102"]
"wmo/simulation/scenarios/verification/verify.py" = ["D102"]
# The waterfall utility's adapter tests stub provider SDK clients, whose kwargs are genuinely
# arbitrary — the fakes have to accept whatever the SDK signature accepts. Scoped to that one
# module tree so the rest of `wmo/` keeps ANN401 in full force.
"wmo/common/vendor/waterfall/**/*_test.py" = ["ANN401"]

[tool.ty.environment]
python-version = "3.12"

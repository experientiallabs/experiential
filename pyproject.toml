[project]
name = "world-model-harness"
version = "0.1.0"
description = "Docker as an LLM: a frontier model acts as your agent's environment, reconstructed from OTel traces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "rich>=13.7",
    "gepa>=0.1.1",
    "tomli-w>=1.0",  # writing .wmh/config.toml (stdlib tomllib reads); every `wmh build` needs it
    "posthog>=7.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
bedrock = ["boto3>=1.34"]
otel = ["opentelemetry-proto>=1.24"]
# Plotting the benchmark grid (scripts/plot_baseline_grid.py); kept out of the core install.
viz = ["seaborn>=0.13", "matplotlib>=3.8"]
# dev pulls in every backend SDK so `ty check` and the full test suite resolve over the whole
# project (the providers import anthropic/openai/boto3 lazily, but type-checking needs them present).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    "world-model-harness[anthropic,openai,bedrock,otel,viz]",
    # Workspace member: benchmark adapters + real-run trace capture (environment-capture/).
    "environment-capture[bedrock,fetch]",
]

[project.scripts]
wmh = "wmh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmh"]

[tool.uv.workspace]
members = ["environment-capture"]

[tool.uv.sources]
environment-capture = { workspace = true }

[tool.pytest.ini_options]
# Tests live inline next to the modules they cover (foo.py -> foo_test.py).
python_files = ["*_test.py"]
testpaths = ["wmh", "environment-capture"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `examples/` holds isolated, self-contained task launch/capture helpers that can depend on their
# own benchmark environments. They are not part of the reusable `wmh` package.
extend-exclude = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# `plot_trace_scaling.py` is a one-off research figure that imports matplotlib ephemerally
# (`uv run --with matplotlib`), not a project dependency — exclude it from the type gate.
# The appworld `backend/` scripts import the heavy `appworld` engine, which lives only in that
# benchmark's local venv (not a project dependency) — exclude them like the figure script above.
exclude = [
    "examples/",
    "scripts/plot_trace_scaling.py",
    "environment-capture/appworld/backend/world_backend.py",
    "environment-capture/appworld/backend/fetch_data.py",
    "environment-capture/gaia2/backend/world_backend.py",
    "environment-capture/gaia2/backend/fetch_data.py",
]

# tau2 smoke: cheapest same-family pair through the REAL tau2 benchmark, warmup-only.
# Exercises the whole tau2 source end to end (tau2 subprocess -> loopback proxy ->
# per-episode Tinker provider -> span sink -> deterministic reward -> CE warmup ->
# gate) for a few dollars. The real tau study trains Qwen3.5-9B from Qwen3.6-27B;
# this pair exists to shake the machinery, not to measure.
#
# One-time setup: tau2-bench is an external clone no wheel can ship, so clone it and
# build its own 3.13 venv somewhere outside this repo, then point the two paths below
# at it (`wmo optimize distill run` names the exact commands if they are missing). The
# values here assume a `.tau2-bench/` clone in the working directory. The pinned azure/
# user simulator needs AZURE_API_KEY, AZURE_API_BASE, AZURE_API_VERSION in the env.
# Task splits are pinned per run as composite "domain/task_id" strings taken from the
# BENCH-B scenario files.
[student]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 16

[teacher]
backend = "tinker"
model = "Qwen/Qwen3.5-9B"

[tau2]
tau2_bin = ".tau2-bench/.venv/bin/tau2"
data_dir = ".tau2-bench/tau2-bench/data"
# user_llm stays at the pinned default (azure/gpt-5.4-mini): the user simulator is
# part of the environment, and every arm of the tau study faces the same customers.

[rollout]
# tau2 episodes are conversations over an in-memory DB: tens of steps, not hundreds.
# max_turns maps to tau2's --max-steps (its own default is 200).
max_turns = 40
episode_timeout_s = 600.0
context_budget_tokens = 32768

[train]
# 0 = warmup-only: this smoke is the cycle-1 shape (teacher rollouts -> keep-filter
# -> CE -> gate), the cheapest full pass through the machinery.
steps = 0
group_size = 1
learning_rate = 1e-4
trial_concurrency = 4

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (unbiased reverse-KL advantages when an OPD leg is added).
[sampling]
temperature = 1.0
max_tokens = 4096

[warmup]
steps = 1
rollouts_per_task = 1

[eval]
every = 0

[gate]
k = 1
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# USD per million tokens, Tinker models page, fetched 2026-07-25 (9B row) --
# re-verify before a paid run; the 4B student rates must be filled from the live
# page at run time (unset meters force the interactive cost confirm).
teacher_prefill = 0.66
teacher_cached_prefill = 0.132
teacher_sample = 1.995

[budget]
max_usd = 15.0

[wandb]
enabled = true
project = "wmo-distill"
run_name = "distill-tau2-smoke"

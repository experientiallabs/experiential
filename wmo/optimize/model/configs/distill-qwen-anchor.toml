# Qwen 9B baseline run: Qwen3.5-9B distilled from Qwen3.6-27B on the full TB2
# split with the headline OpenClaw-RL / Slime objective: the RAW per-token
# teacher-minus-student logprob gap as the advantage (no clipping, no
# centering) trained under Tinker's ppo loss, so regularization comes from
# PPO ratio clipping inside the loss instead of from reshaping the advantage.
#
# The Qwen lane exists to check the result is not a Nemotron artifact, so the
# objective, split, and schedule are held identical to distill-super-anchor and
# only the model axis moves. Teacher and student must share a tokenizer or the
# run aborts at tokenizer_fingerprint_check; Qwen3.6 reuses the Qwen3.5
# tokenizer and renderer, so this pair is aligned. Model names are the
# tinker-cookbook catalog names (pinned by
# test_checked_in_run_configs_resolve_cookbook_renderers).
[student]
base_model = "Qwen/Qwen3.5-9B"
lora_rank = 32

[teacher]
backend = "tinker"
model = "Qwen/Qwen3.6-27B"

[harbor]
job_template = "wmo/optimize/model/configs/tb2-harbor-job-template.yaml"
backend = "local"
reward_key = "reward"

[rollout]
max_turns = 100
# 2700s: the 300s default every rollout silently inherited ended 31% of trials on the
# wall clock, and it stays inside the E2B sandbox lease ceiling.
episode_timeout_s = 2700.0
# Leaves sampling.max_tokens of room under the served window: 53240 + 12288 = 65528.
# NOT 65536. Tinker's usable ceiling is 65,530, six short of the nominal window -- measured on
# the sibling Fireworks/Tinker lane, where a 65,534-token sample was rejected outright, and
# neither Qwen3.5-9B nor Qwen3.6-27B has a longer-context catalog variant. Summing to exactly
# 65536 leaves a band of prompt lengths that terminus-2 admits and Tinker then refuses.
#
# Sized against measured episodes rather than guessed: under the strip-history renderer the
# largest of 86 recorded TB2 episodes reaches ~40k, so this carries ~30% headroom. The previous
# 49152/16384 split killed 27 of 53 teacher-baseline trials with ContextLengthExceededError --
# terminus-2 FAILS a trial on overflow rather than ending the episode, so an overflow does not
# score 0, it leaves the denominator and silently biases the solve rate upward.
context_budget_tokens = 53240

# ON. terminus-2's own default is enable_summarize=True; OFF was our deviation, taken to protect
# the prefix property -- which the strip-history renderer above has already given up, so it now
# protects nothing and costs whole trials. With it off, a context overflow RAISES and the trial
# fails, leaving the denominator instead of scoring 0: on this holdout that was 39% of teacher
# trials (17 of 44), splitting the measured solve rate 92.3% excluded vs 55.8% overflow-as-zero.
#
# Safe here, verified in harbor's source rather than assumed: Chat.reset_response_chain() clears
# only _last_response_id, so every real turn's prompt/completion token ids are still recorded even
# though chat._messages is truncated to three; and the three summarization subagents call
# self._llm.call() directly, bypassing the Chat, so their turns never enter the training data.
# Rejected by config validation if ever paired with a verbatim renderer.
compaction = true

# Terminus-2 cannot use the stock reasoning renderers: they hand harbor's response parser a
# LIST and kill the trial. The wmo wrappers fix that; the choice between them is the
# reasoning-in-history trade (wmo/optimize/model/renderers.py).
#
# strip_history, NOT verbatim. The model still reasons every turn and every one of those
# reasoning tokens is inside the loss mask -- what changes is only that a turn is not shown its
# OWN earlier reasoning, which is how the stock renderers and the published terminus-2 setups
# run. Carrying it forward is what overflowed the window above. Measured consequence of the
# swap on 86 recorded episodes: final context p50 23,631 -> 8,682, max 49,117 -> 40,162.
# The cost is the prefix property: the episode fragments into one datum per turn, so teacher
# prefill rises ~5.1x cold (~2.6x once the shared prefix bills at the cached rate).
[rollout.renderers]
"Qwen/Qwen3.5-9B" = "wmo/qwen3_5_strip_history"
"Qwen/Qwen3.6-27B" = "wmo/qwen3_5_strip_history"

[train]
# ppo: same datums as importance_sampling (target_tokens, logprobs,
# advantages), but the service clips the policy ratio instead of relying on a
# bounded advantage (its default epsilon, reported symmetric 0.2; no
# loss_fn_config is sent).
loss = "ppo"
steps = 30
tasks_per_batch = 16
group_size = 4
learning_rate = 5e-5
# advantage_clip deliberately UNSET and centering off: the advantage is the
# raw teacher-minus-student gap. Caveat to watch: with one optimizer step per
# batch and sampler_refresh_every = 1 the policy ratio is ~1, so the ppo clip
# almost never binds and nothing bounds a single token's magnitude. Read
# train/advantage_std and train/grad_norm on the dashboard; if either spikes,
# set a bound here (start around 8 to 10) rather than restarting blind.
center_advantages = false
max_datum_tokens = 65536
sampler_refresh_every = 1
save_state_every = 4
trial_concurrency = 32

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (unbiased reverse-KL advantages).
[sampling]
temperature = 1.0
# 12288, down from 16384, to buy context headroom. Measured on 702 real terminus-2 turns:
# p50 520, p90 4,127, and 3.85% already hit the old 16,384 cap; at 12,288 about 4.7% do. That
# 0.9pt of extra truncation buys 4,096 tokens of context, and an overflow costs a whole trial
# where a truncated turn costs one turn.
max_tokens = 12288

# On-policy from step 1, same as the Nemotron anchor.
[warmup]
steps = 0

[eval]
every = 10
tasks = 12
k = 1
# No teacher_baseline_from: every measured baseline in this tree was produced by a
# Nemotron teacher, and importing one here would gate a Qwen run against another
# model's solve rate. This run measures its own.

[gate]
k = 3
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# USD per million tokens, Tinker models page, fetched 2026-07-25.
# An EMPTY table silently prices every meter at 0, so budget.max_usd can never fire.
# student = Qwen/Qwen3.5-9B: prefill 0.66, cached 0.132, sample 1.995, train 1.463
# teacher = Qwen/Qwen3.6-27B: prefill 1.86, cached 0.372, sample 5.595, train 4.103
student_prefill = 0.66
student_cached_prefill = 0.132
student_sample = 1.995
student_train = 1.463
teacher_prefill = 1.86
teacher_cached_prefill = 0.372
teacher_sample = 5.595

[budget]
# Priced from the 86 recorded episodes at COLD teacher rates ($0.53/episode): 30 x 16 x 4 =
# 1,920 episodes ~= $1,024, plus its own three baselines. If the teacher's shared prefix bills
# cached, it lands nearer $680. Budget the cold case and let caching be upside. $555.57 of the
# $2,000 authorized was spent before this run.
max_usd = 1200.0

[wandb]
enabled = true
project = "wmo-distill"
run_name = "distill-qwen-anchor"

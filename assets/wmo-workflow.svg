<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Simulation, routing, and optimization</title>
  <desc id="description">Three connected stages show WMO building grounded simulations, routing each request, and training custom models.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a0a0a"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #ececec; stroke-width: 2; }
      .step { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.12em; }
      .title { fill: #0a0a0a; font: 600 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .copy { fill: #525252; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .flow { fill: none; stroke: #0a0a0a; stroke-width: 2; marker-end: url(#arrow); }
      .flow-label { fill: #737373; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#ffffff"/>

  <rect class="card" x="40" y="72" width="320" height="216" rx="16"/>
  <rect x="40" y="72" width="6" height="216" rx="3" fill="#0070f3"/>
  <text class="step" x="76" y="118" fill="#0070f3">01</text>
  <text class="title" x="76" y="166">Simulation</text>
  <text class="copy" x="76" y="208">Text world models grounded</text>
  <text class="copy" x="76" y="236">in your agent traces</text>

  <path class="flow" d="M 376 180 L 424 180"/>
  <text class="flow-label" x="400" y="164">tasks</text>

  <rect class="card" x="440" y="72" width="320" height="216" rx="16"/>
  <rect x="440" y="72" width="6" height="216" rx="3" fill="#7928ca"/>
  <text class="step" x="476" y="118" fill="#7928ca">02</text>
  <text class="title" x="476" y="166">Routing</text>
  <text class="copy" x="476" y="208">The best model for every</text>
  <text class="copy" x="476" y="236">request</text>

  <path class="flow" d="M 776 180 L 824 180"/>
  <text class="flow-label" x="800" y="164">traces</text>

  <rect class="card" x="840" y="72" width="320" height="216" rx="16"/>
  <rect x="840" y="72" width="6" height="216" rx="3" fill="#f5a623"/>
  <text class="step" x="876" y="118" fill="#b66f00">03</text>
  <text class="title" x="876" y="166">Optimization</text>
  <text class="copy" x="876" y="208">Custom open source models</text>
  <text class="copy" x="876" y="236">trained for your agent</text>
</svg>

# python-package: builds the experiential sdist and wheel and the
# exp-gateway-native abi3 wheels, smoke-tests them, and publishes both
# distributions to PyPI for release tags and explicit latest-release replays.
# Runs only for protected release tags (v<version>) and manual runs
# (RUN_WORKFLOW=python-package): every job uses a GitLab-hosted runner, which
# bills the group's compute minutes, macOS at six times the small Linux rate.

variables:
  PYTHON_PACKAGE_SOURCE:
    value: latest-release
    options:
      - latest-release
      - selected-ref
    description: >-
      Manual python-package runs only: latest-release rebuilds the tag of the
      latest GitLab release (a release replay); selected-ref builds the ref the
      pipeline runs on (an exact-ref verification).
  PYTHON_PACKAGE_PUBLISH:
    value: "false"
    options:
      - "false"
      - "true"
    description: >-
      Manual python-package runs only: true runs the release checks and
      publishes to PyPI. The upload itself runs only for latest-release on main.

.python-package-rules:
  rules:
    # A tag only builds and publishes once v* tags are protected, so an
    # unprotected tag push runs nothing.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RUN_WORKFLOW == "python-package"

.python-package-snippets:
  # A latest-release replay builds the tag python-package-source resolved;
  # every other pipeline builds its own commit.
  release-source:
    - |
      if [[ "${CI_PIPELINE_SOURCE}" =~ ^(web|api)$ && "${PYTHON_PACKAGE_SOURCE}" == latest-release ]]; then
        : "${PYTHON_PACKAGE_RELEASE_TAG:?python-package-source did not resolve a release tag}"
        git fetch --quiet --no-tags --depth=1 origin "+refs/tags/${PYTHON_PACKAGE_RELEASE_TAG}:refs/tags/${PYTHON_PACKAGE_RELEASE_TAG}"
        git checkout --quiet --detach "refs/tags/${PYTHON_PACKAGE_RELEASE_TAG}"
      fi
  release-source-windows:
    - |
      if ($env:CI_PIPELINE_SOURCE -match '^(web|api)$' -and $env:PYTHON_PACKAGE_SOURCE -eq 'latest-release') {
        if (-not $env:PYTHON_PACKAGE_RELEASE_TAG) { throw 'python-package-source did not resolve a release tag' }
        git fetch --quiet --no-tags --depth=1 origin "+refs/tags/$($env:PYTHON_PACKAGE_RELEASE_TAG):refs/tags/$($env:PYTHON_PACKAGE_RELEASE_TAG)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git checkout --quiet --detach "refs/tags/$($env:PYTHON_PACKAGE_RELEASE_TAG)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
  # Builds the abi3 extension wheel in a manylinux2014 image, the compatibility
  # every published Linux wheel carries.
  manylinux-wheel:
    - /opt/python/cp312-cp312/bin/python -m pip install --quiet --no-cache-dir --disable-pip-version-check --root-user-action=ignore "uv==${UV_VERSION}" "maturin==${MATURIN_VERSION}"
    - export PATH="/opt/python/cp312-cp312/bin:$PATH"
    - !reference [.snippets, rust]
    - maturin build --release --locked --compatibility manylinux2014 --manifest-path exp/runtime/gateway/native/Cargo.toml --out native-dist
  # Smoke tests the wheel on its own platform.
  smoke-native:
    - uv venv --python 3.12 native-smoke
    - uv pip install --python native-smoke/bin/python native-dist/*.whl
    - native-smoke/bin/python -c "import exp_gateway_native as n; assert n.__version__; assert callable(n.serve)"

python-package-source:
  stage: preflight
  image: python:3.12.15-slim-trixie@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RUN_WORKFLOW == "python-package" && $PYTHON_PACKAGE_SOURCE == "latest-release"
  variables:
    GIT_STRATEGY: none
  script:
    - |
      python3 - <<'PY'
      import json
      import os
      import urllib.request

      request = urllib.request.Request(
          f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/releases/permalink/latest",
          headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]},
      )
      with urllib.request.urlopen(request, timeout=30) as response:
          release = json.load(response)
      # A release dated in the future is not published yet.
      if release.get("upcoming_release"):
          raise SystemExit(f"the latest release {release['tag_name']} is not published yet")
      with open("python-package-source.env", "w", encoding="utf-8") as handle:
          handle.write(f"PYTHON_PACKAGE_RELEASE_TAG={release['tag_name']}\n")
      PY
    - cat python-package-source.env
  artifacts:
    reports:
      dotenv: python-package-source.env

.python-package-wheel-linux:
  extends: [.tools]
  stage: build
  needs:
    - job: python-package-source
      optional: true
  artifacts:
    paths:
      - native-dist/

python-package-wheel-linux-x86_64:
  extends: [.python-package-wheel-linux]
  image: quay.io/pypa/manylinux2014_x86_64:2026.09.23-1@sha256:2fa5f99f660f115f547d96b4edcadfc19f77a6de8807734bf0fc4924f81be01a
  rules: !reference [.python-package-rules, rules]
  script:
    - !reference [.python-package-snippets, release-source]
    - !reference [.python-package-snippets, manylinux-wheel]
    # This target also carries the extension's sdist.
    - maturin sdist --manifest-path exp/runtime/gateway/native/Cargo.toml --out native-dist
    - !reference [.python-package-snippets, smoke-native]

python-package-wheel-linux-aarch64:
  extends: [.python-package-wheel-linux]
  image: quay.io/pypa/manylinux2014_aarch64:2026.09.23-1@sha256:47940daeb8e0fdcc7deefad334bfda3d8d12b447ba1ebd5411f9f106318eafdb
  tags: [saas-linux-small-arm64]
  rules: !reference [.python-package-rules, rules]
  script:
    - !reference [.python-package-snippets, release-source]
    - !reference [.python-package-snippets, manylinux-wheel]
    - !reference [.python-package-snippets, smoke-native]

# Hosted macOS runners are Apple silicon.
.python-package-wheel-macos:
  extends: [.tools]
  stage: build
  image: macos-15-xcode-16
  tags: [saas-macos-medium-m1]
  needs:
    - job: python-package-source
      optional: true
  before_script:
    - !reference [.snippets, uv-macos]
    - !reference [.snippets, rust]
  artifacts:
    paths:
      - native-dist/

python-package-wheel-macos-arm64:
  extends: [.python-package-wheel-macos]
  rules: !reference [.python-package-rules, rules]
  script:
    - !reference [.python-package-snippets, release-source]
    - uvx --from "maturin==${MATURIN_VERSION}" maturin build --release --locked --manifest-path exp/runtime/gateway/native/Cargo.toml --out native-dist
    - !reference [.python-package-snippets, smoke-native]

# The Intel wheel is cross-compiled on the Apple silicon runner, so it cannot
# import there and skips the smoke test.
python-package-wheel-macos-x86_64:
  extends: [.python-package-wheel-macos]
  rules: !reference [.python-package-rules, rules]
  script:
    - !reference [.python-package-snippets, release-source]
    - rustup target add x86_64-apple-darwin
    - uvx --from "maturin==${MATURIN_VERSION}" maturin build --release --locked --target x86_64-apple-darwin --manifest-path exp/runtime/gateway/native/Cargo.toml --out native-dist

# The hosted Windows runner runs a fixed Windows Server 2022 VM with
# PowerShell and takes no image. It has two cores, so compiling the crate's
# dependencies dominates the job: the Rust toolchain, the crate downloads, and
# the compiled dependencies persist in the job cache under .ci-cache/, the only
# place GitLab caches from. uv's Python installs stay out of the cache, because
# the runner cannot archive the directory links uv creates there.
python-package-wheel-windows-x86_64:
  extends: [.tools]
  stage: build
  tags: [saas-windows-medium-amd64]
  needs:
    - job: python-package-source
      optional: true
  rules: !reference [.python-package-rules, rules]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.ci-cache/cargo
    RUSTUP_HOME: $CI_PROJECT_DIR/.ci-cache/rustup
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/.ci-cache/target
  cache:
    key: python-package-wheel-windows-x86_64
    paths:
      - .ci-cache/
  script:
    - !reference [.python-package-snippets, release-source-windows]
    - !reference [.snippets, uv-windows]
    - !reference [.snippets, rust-windows]
    # The abi3 build links python3.lib from an explicit Python 3.12.
    - uv python install 3.12
    - $python = uv python find 3.12
    - uvx --from "maturin==$env:MATURIN_VERSION" maturin build --release --locked --interpreter $python --manifest-path exp/runtime/gateway/native/Cargo.toml --out native-dist
    - uv venv --python 3.12 native-smoke
    - uv pip install --python native-smoke\Scripts\python.exe (Get-ChildItem native-dist\*.whl).FullName
    - .\native-smoke\Scripts\python.exe -c "import exp_gateway_native as n; assert n.__version__; assert callable(n.serve)"
  artifacts:
    paths:
      - native-dist/

python-package-build:
  extends: [.tools]
  stage: build
  image: python:3.12.15-trixie@sha256:22b3d25281ff46186331c6c95fbb52aa7e65261013a9c7612002656e4290410f
  rules: !reference [.python-package-rules, rules]
  # Waits for every wheel the pipeline builds; only the linux-x86_64 wheel's
  # files are needed here.
  needs:
    - job: python-package-source
      optional: true
    - job: python-package-wheel-linux-x86_64
    - job: python-package-wheel-linux-aarch64
      optional: true
      artifacts: false
    - job: python-package-wheel-macos-x86_64
      optional: true
      artifacts: false
    - job: python-package-wheel-macos-arm64
      optional: true
      artifacts: false
    - job: python-package-wheel-windows-x86_64
      optional: true
      artifacts: false
  script:
    - !reference [.python-package-snippets, release-source]
    - !reference [.snippets, uv]
    - uv build --package experiential --no-sources
    - |
      # Smoke test the wheel from outside the checkout.
      uv venv --python 3.12 /tmp/exp-wheel-smoke
      uv pip install --python /tmp/exp-wheel-smoke/bin/python dist/*.whl native-dist/*.whl "openai==3.0.0"
      (
        cd /tmp
        /tmp/exp-wheel-smoke/bin/python - <<'PY'
      import exp
      import exp.common.models
      import exp.runtime.models
      from exp.runtime.environments import LocalProcessEnvironmentRuntime
      from exp.runtime.openai_protocol import completed_body, decode_chat
      from exp.runtime.router import RouterRuntime
      from exp.simulation import compare_text_and_sandbox
      from exp.simulation.engines import SandboxSimulator
      from exp.optimize.router import RouterCompositionResult
      from exp.simulation import SimulationSpec

      assert callable(exp.compose_router)
      assert callable(exp.load_project_router)
      assert callable(exp.load_router)
      assert callable(decode_chat)
      assert callable(completed_body)
      assert exp.RouterRuntime is RouterRuntime
      assert exp.RouterCompositionResult is RouterCompositionResult
      assert "create_project_router_app" not in exp.__all__
      assert callable(compare_text_and_sandbox)
      assert SimulationSpec.__module__ == "exp.simulation.specs.simulation"
      assert SandboxSimulator.__module__ == "exp.simulation.engines.sandbox"
      assert LocalProcessEnvironmentRuntime.__module__ == "exp.runtime.environments.local"

      import exp_gateway_native

      assert exp_gateway_native.__version__
      assert callable(exp_gateway_native.serve)
      PY
        /tmp/exp-wheel-smoke/bin/exp --help
      )
    - |
      # Release tags and publishing replays never ship unreleased native changes.
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${PYTHON_PACKAGE_PUBLISH:-false}" = true ]; then
        test ! -e .github/deferred-native-release.toml
      fi
    - |
      # Installed-wheel no-spend release evidence, run from outside the checkout.
      # A latest-release replay checks out the release tag rather than
      # CI_COMMIT_SHA, so the evidence pins the checkout through
      # EXP_RELEASE_REVISION alone.
      source_revision="$(git rev-parse HEAD)"
      cp exp/tests/release_test.py /tmp/exp-wheel-smoke/installed_release_evidence.py
      (
        cd /tmp/exp-wheel-smoke
        env -u CI_COMMIT_SHA PYTHONNOUSERSITE=1 TERM=xterm-256color EXP_INSTALLED_RELEASE_EVIDENCE=1 \
          EXP_RELEASE_REVISION="${source_revision}" EXP_SOURCE_CHECKOUT="${CI_PROJECT_DIR}" \
          EXP_TELEMETRY=0 ./bin/python installed_release_evidence.py
      )
  artifacts:
    paths:
      - dist/

python-package-capture-smoke:
  extends: [.tools]
  stage: test
  image: python:3.13.17-trixie@sha256:2d90366719bf27f9a26d3496b34bfe44fc383b10e7360ca316152f7b348f4f92
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RUN_WORKFLOW == "python-package" && $PYTHON_PACKAGE_PUBLISH == "true"
  needs:
    - job: python-package-build
    - job: python-package-wheel-linux-x86_64
  variables:
    GIT_STRATEGY: none
  script:
    - !reference [.snippets, uv]
    # Require published Capture dependencies before release. This job tests a
    # downloaded copy of the finished publish artifact; it saves no artifacts
    # and holds no publishing credentials.
    - uv venv --python 3.13 /tmp/exp-capture-release-smoke
    - uv pip install --python /tmp/exp-capture-release-smoke/bin/python dist/*.whl native-dist/*.whl "openai==3.0.0"
    - /tmp/exp-capture-release-smoke/bin/python -c "import mitmproxy, mitmproxy_rs"

python-package-publish:
  extends: [.tools]
  stage: publish
  image: python:3.12.15-trixie@sha256:22b3d25281ff46186331c6c95fbb52aa7e65261013a9c7612002656e4290410f
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $RUN_WORKFLOW == "python-package" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PYTHON_PACKAGE_SOURCE == "latest-release" && $PYTHON_PACKAGE_PUBLISH == "true"
  needs:
    - job: python-package-build
    - job: python-package-capture-smoke
      artifacts: false
    - job: python-package-wheel-linux-x86_64
    - job: python-package-wheel-linux-aarch64
    - job: python-package-wheel-macos-x86_64
    - job: python-package-wheel-macos-arm64
    - job: python-package-wheel-windows-x86_64
  environment:
    name: pypi
  # This project's path was used by an earlier project, so GitLab issues it no
  # ID tokens, and PyPI's GitLab trusted publisher only accepts a path subject.
  # Each distribution uploads with its own project-scoped PyPI API token, in
  # the protected, masked PYPI_TOKEN_EXP_GATEWAY_NATIVE and
  # PYPI_TOKEN_EXPERIENTIAL variables. Their environment scope is pypi, so this
  # is the only job that receives them; no other job may declare an environment.
  variables:
    GIT_STRATEGY: none
  script:
    - !reference [.snippets, uv]
    - mv native-dist/* dist/
    - |
      # Drop files whose exact filename is already on PyPI. A release can carry
      # a native package whose version did not change (for example an
      # experiential-only bump). The native build is not byte-reproducible, so a
      # rebuilt wheel with an already-published filename would fail uv publish's
      # hash check. PyPI treats filenames as immutable, so the published copy is
      # authoritative; drop the local duplicate and let --check-url verify
      # everything that remains.
      for file in dist/*; do
        name="$(basename "$file")"
        project="$(echo "$name" | sed -E 's/-[0-9].*//' | tr '_' '-')"
        code="$(curl -sSL --retry 3 -o /tmp/pypi-index.html -w '%{http_code}' \
          "https://pypi.org/simple/$project/")"
        if [ "$code" = "200" ] && grep -qF "$name" /tmp/pypi-index.html; then
          echo "Dropping $name: already published to $project"
          rm "$file"
        elif [ "$code" != "200" ] && [ "$code" != "404" ]; then
          echo "PyPI index lookup for $project failed with HTTP $code" >&2
          exit 1
        fi
      done
      ls dist/
    - |
      # Publish each distribution with its own project-scoped API token. The
      # native package goes first, so experiential never reaches PyPI ahead of
      # the native version it requires.
      if [ -z "$(ls -A dist)" ]; then
        echo "Nothing to publish: every built file is already on PyPI"
        exit 0
      fi
      : "${PYPI_TOKEN_EXP_GATEWAY_NATIVE:?PYPI_TOKEN_EXP_GATEWAY_NATIVE is not available to this pipeline}"
      : "${PYPI_TOKEN_EXPERIENTIAL:?PYPI_TOKEN_EXPERIENTIAL is not available to this pipeline}"
      if ls dist/exp_gateway_native-* >/dev/null 2>&1; then
        UV_PUBLISH_TOKEN="${PYPI_TOKEN_EXP_GATEWAY_NATIVE}" uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/exp_gateway_native-*
      fi
      if ls dist/experiential-* >/dev/null 2>&1; then
        UV_PUBLISH_TOKEN="${PYPI_TOKEN_EXPERIENTIAL}" uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/experiential-*
      fi

id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2026-11-26
reason = "block-buffer 0.10.4 in the native gateway, pulled by digest 0.10 (sha1, sha2). The corruption needs a compress callback that panics and is caught; neither hash's compression panics and the gateway never catches one around it. The fix is block-buffer 0.12.1, which needs the digest 0.11 line; move once sha1/sha2 release on it."

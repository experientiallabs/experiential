reason = "Source-confirmed false positive for block-buffer 0.10.4: its cursor is a separate pos:u8, not the input-overwritten inline cursor in the advisory; ReadBuffer is absent. release_test pins the exact version/checksum while this exception exists, and the native caught-compression-panic regression proves pos stays 2. Upstream source: https://github.com/RustCrypto/utils/blob/block-buffer-v0.10.4/block-buffer/src/lib.rs. Remove or re-review on any version/source change."


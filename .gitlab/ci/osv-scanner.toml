[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2026-11-23
reason = "libsqlite3-sys 0.36.0 (rusqlite 0.38 bundled SQLite) in the native local capture store, which opens only its own database under the user's capture directory. The advisory needs an attacker-crafted database plus -wal file pair on the local disk. The fix is rusqlite with libsqlite3-sys 0.39 (SQLite 3.54); bump it in a dedicated native change and delete this entry."

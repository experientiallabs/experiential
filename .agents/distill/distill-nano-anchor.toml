# Super anchor run: Nemotron-3 Super distilled from Ultra on the full TB2
# split with the headline OpenClaw-RL / Slime objective: the RAW per-token
# teacher-minus-student logprob gap as the advantage (no clipping, no
# centering) trained under Tinker's ppo loss, so regularization comes from
# PPO ratio clipping inside the loss instead of from reshaping the advantage.
#
# This run is the shared
# COLLECTION SOURCE for the super variants: it collects the warmup teacher
# trajectories itself (no warmup.trajectories_from), and the topk/aggressive
# siblings load its warmup-trials.json and reuse its pre-training student
# baseline. Run it under .wmh/distill-runs/super-anchor so the sibling paths
# resolve. Model names are the tinker-cookbook catalog names (pinned by
# test_checked_in_run_configs_resolve_cookbook_renderers).
[student]
base_model = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
lora_rank = 32

[teacher]
backend = "tinker"
model = "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16:peft:262144"

[harbor]
job_template = ".agents/distill/tb2-harbor-job-template.yaml"
backend = "local"
reward_key = "reward"

[rollout]
max_turns = 100
# 1800s: the 300s default every rollout silently inherited ended 31% of trials on the
# wall clock, and it stays inside the E2B sandbox lease ceiling.
episode_timeout_s = 2700.0
# Also the context window sent to the pi runner (240000 + 16384 < the 262144 tier).
context_budget_tokens = 49152
compaction = false

[train]
# ppo: same datums as importance_sampling (target_tokens, logprobs,
# advantages), but the service clips the policy ratio instead of relying on a
# bounded advantage (its default epsilon, reported symmetric 0.2; no
# loss_fn_config is sent).
loss = "ppo"
steps = 45
tasks_per_batch = 16
group_size = 4
learning_rate = 5e-5
# advantage_clip deliberately UNSET and centering off: the advantage is the
# raw teacher-minus-student gap. Caveat to watch: with one optimizer step per
# batch and sampler_refresh_every = 1 the policy ratio is ~1, so the ppo clip
# almost never binds and nothing bounds a single token's magnitude. Read
# train/advantage_std and train/grad_norm on the dashboard; if either spikes,
# set a bound here (start around 8 to 10) rather than restarting blind.
center_advantages = false
max_datum_tokens = 65536
sampler_refresh_every = 1
save_state_every = 4
trial_concurrency = 32

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (unbiased reverse-KL advantages).
[sampling]
temperature = 1.0
max_tokens = 16384

# This run COLLECTS the warmup trajectories (trajectories_from is unset);
# the super-topk and super-aggressive configs load this run's manifest.
[warmup]
steps = 0

[eval]
every = 10
tasks = 12
k = 1
# Import the teacher baseline measured 2026-07-25 on the FIXED scaffold: Ultra-550B at
# 35.3% over 17 holdout tasks x 3 attempts, $29.15, run dir super-anchor-v2. This is NOT the
# void 13.7% that used to be imported here -- that one was measured on the broken pi scaffold
# where only 7.8% of episodes reached a submit. Treat 35.3% as a LOWER BOUND: 39.2% of its
# episodes were still lost to the harness because a shared wall clock and sampling deadline
# penalise the slower, larger teacher (Ultra lost 40% where Super lost 14.6%).
teacher_baseline_from = ".wmh/distill-runs/super-anchor-v2/evals/baseline-teacher.json"
# Import BOTH baselines: they were measured on this exact student/teacher/holdout, and
# importing them means the two arms start from an IDENTICAL measured baseline rather than two
# independent measurements of the same thing (which would add noise to the very delta the
# two-arm comparison is trying to resolve). Teacher: Ultra-550B 35.3%. Student: Nano-30B 9.8%
# binary / 20.6% graded, with 58.8% scaffold loss -- absolute rates are harness-depressed, so
# read the before/after DELTA, not the levels.
student_baseline_from = ".wmh/distill-runs/nano-anchor/evals/baseline-student-before.json"

[gate]
k = 3
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# Ultra 64K (verified live 2026-07-23): prefill 2.49, sample 6.225 USD/Mtok.
# Cached prefill 0.498 is exactly the 20%-of-prefill default, so both cached
# rates are left implied.
teacher_prefill = 3.32
teacher_sample = 8.30
# Super rates from the Tinker models page: prefill 0.57, sample 1.44,
# train 1.276 USD/Mtok.
student_prefill = 0.57
student_sample = 1.44
student_train = 1.276

[budget]
max_usd = 900.0

[wandb]
enabled = true
project = "wmh-distill"
run_name = "distill-super-anchor"

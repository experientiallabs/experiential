# Product smoke: Nemotron-3 Nano student distilled from the Ultra teacher on TB2 tasks.
# Ultra/Super tokenizer files verified byte-identical (sha256) 2026-07-23; Nano is checked
# live by the preflight fingerprint. Re-verify lineup names + prices before running.
# Model names are the tinker-cookbook catalog names (get_recommended_renderer_name must
# resolve them, pinned by test_checked_in_run_configs_resolve_cookbook_renderers).
[student]
base_model = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
lora_rank = 32

[teacher]
backend = "tinker"
model = "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16"

[harbor]
job_template = ".agents/distill/tb2-harbor-job-template.yaml"
backend = "local"
reward_key = "reward"

[rollout]
max_turns = 20
context_budget_tokens = 65536
compaction = false

[train]
steps = 6
tasks_per_batch = 4
group_size = 4
learning_rate = 1e-4
advantage_clip = 4.0
center_advantages = true
max_datum_tokens = 65536
sampler_refresh_every = 1
save_state_every = 2
trial_concurrency = 4

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (unbiased reverse-KL advantages).
[sampling]
temperature = 1.0
max_tokens = 8192

# SFT warmup on the teacher's own passing pi trajectories: the first smoke's
# student solved 0% before AND after OPD (it sampled only failures, so the
# reverse KL stayed flat). The teacher solves ~25%, so 8 train tasks x 2
# attempts yields ~4 passing trajectories for the warmup SFT set.
[warmup]
steps = 2
rollouts_per_task = 2
keep = "passed"

[eval]
every = 3
tasks = 4
k = 1

[gate]
k = 3
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# Ultra 64K (2026-07-23): prefill 2.49, cached prefill 0.498, sample 6.225, train 5.478 USD/Mtok.
# Nano: fill from the live models page at run time.
teacher_prefill = 2.49

[budget]
max_usd = 75.0

# Optional Weights & Biases tracking; needs `uv sync --extra distill` plus
# WANDB_API_KEY (or a prior `wandb login`). Uncomment to enable.
[wandb]
enabled = true
project = "wmh-distill"

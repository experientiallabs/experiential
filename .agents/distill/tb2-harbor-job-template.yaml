job_name: wmh-distill-placeholder
jobs_dir: /tmp/wmh-distill-jobs
n_concurrent_trials: 1
# Task sandboxes on E2B (the scorer rewrites this to wmh's E2B environment import
# path); must agree with the requested --backend or the scorer rejects the combo.
environment:
  type: e2b
# Registry dataset: resolved + pinned once per run by resolve_harbor_tasks; no local
# checkout dependency (the former local TB2 source dir was removed 2026-07-23).
datasets:
- name: terminal-bench
  version: "2.0"
# The scorer owns agent identity/model/kwargs; the template agent must stay unset.
agents:
- {}

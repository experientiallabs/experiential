# Dev smoke: cheapest same-family pair to shake out the pipeline end to end.
# Re-verify model names against the live Tinker lineup before running (lineup churns).
[student]
base_model = "Qwen/Qwen3.5-4B"
lora_rank = 16

[teacher]
backend = "tinker"
model = "Qwen/Qwen3.5-9B"

[harbor]
job_template = ".agents/distill/tb2-harbor-job-template.yaml"
backend = "local"
reward_key = "reward"

[rollout]
max_turns = 20
context_budget_tokens = 65536
compaction = false

[train]
steps = 3
tasks_per_batch = 4
group_size = 2
learning_rate = 1e-4
advantage_clip = 4.0
center_advantages = true
max_datum_tokens = 65536
sampler_refresh_every = 1
save_state_every = 2
trial_concurrency = 1

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (unbiased reverse-KL advantages).
[sampling]
temperature = 1.0
max_tokens = 4096

[warmup]
steps = 0

[eval]
every = 0
tasks = 4
k = 1

[gate]
k = 2
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# Fill from the live Tinker models page at run time; unset forces interactive confirm.

[budget]
max_usd = 15.0

# Optional Weights & Biases tracking; needs `uv sync --extra distill` plus
# WANDB_API_KEY (or a prior `wandb login`). Uncomment to enable.
[wandb]
enabled = true
project = "wmh-distill"

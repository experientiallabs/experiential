# Cycle 1 of the canonical tau ladder: WARMUP-ONLY distillation on real tau2.
# Teacher Qwen3.6-27B drives all 97 pinned train tasks x 2 rollouts (canonical
# real-tau2 protocol pins, adopted by the joint-tau master 2026-07-27), the kept
# episodes train Qwen3.5-9B LoRA r32 by cross-entropy, and ONE pre-registered
# gate read compares teacher / student-before / student-after at k=3 on the
# 20-task pinned holdout. Approved by Silen (GO, cap $120) and acked by the
# joint-tau master (DECISIONS.md 2026-07-27 "cross-lane weave").
#
# Splits: .agents/distill/tau2-{train,holdout}-task-ids.json (97/20, seed-4405
# lineage, leak-guarded). Run from the repo root with TINKER_API_KEY and
# AZURE_API_KEY/AZURE_API_BASE/AZURE_API_VERSION set:
#
#   uv run wmo optimize distill run \
#     --config .agents/distill/distill-tau2-cycle1.toml \
#     --task-ids .agents/distill/tau2-train-task-ids.json \
#     --holdout-task-ids .agents/distill/tau2-holdout-task-ids.json \
#     --run-dir .wmo/distill-runs/tau2-cycle1 --yes
[student]
base_model = "Qwen/Qwen3.5-9B"
lora_rank = 32

[teacher]
backend = "tinker"
model = "Qwen/Qwen3.6-27B"

[tau2]
tau2_bin = "packages/environment-capture/tau-bench/.venv/bin/tau2"
data_dir = "packages/environment-capture/tau-bench/tau2-bench/data"
# user_llm stays at the pinned default (azure/gpt-5.4-mini): part of the
# canonical protocol; changing it is a new capture cohort.

# The CANONICAL real-tau2 protocol pins (constant across every arm).
[rollout]
max_turns = 100
episode_timeout_s = 1800.0
# At least sampling.max_tokens below Tinker's usable 65,530 ceiling; also the
# datum builder's whole-episode drop threshold.
context_budget_tokens = 57336

[train]
# 0 = warmup-only: the supervised phase is the whole run (cycle 1's shape);
# the gate still measures student-after on the warmed sampler.
steps = 0
learning_rate = 1e-4
trial_concurrency = 8

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (matters when cycle 2 adds the OPD leg on this lineage).
[sampling]
temperature = 1.0
max_tokens = 8192

[warmup]
# 2 CE passes over the kept teacher datums (full-batch epochs, the merged
# loop's deterministic schedule); 2 rollouts per train task per Silen's ruling.
steps = 2
rollouts_per_task = 2
keep = "passed"

[eval]
every = 0

# ONE pre-registered gate read per cycle (master's ack condition): nothing
# selects on holdout results before this.
[gate]
k = 3
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# USD per million tokens, Tinker models page, fetched 2026-07-25 (anchor config
# lineage). MANDATORY: an empty table silently prices every meter at 0 and the
# budget cap never fires.
student_prefill = 0.66
student_cached_prefill = 0.132
student_sample = 1.995
student_train = 1.463
teacher_prefill = 1.86
teacher_cached_prefill = 0.372
teacher_sample = 5.595

[budget]
# Silen's approved cap. Forecast: ~$113 uncached ceiling, $50-80 realistic.
max_usd = 120.0

[wandb]
enabled = true
project = "wmo-distill"
run_name = "tau2-cycle1-warmup"
tags = ["tau-ladder", "cycle-1", "warmup-only"]

# Super anchor run: Nemotron-3 Super distilled from Ultra on the full TB2
# split with the headline importance-sampling loss. This run is the shared
# COLLECTION SOURCE for the super variants: it collects the warmup teacher
# trajectories itself (no warmup.trajectories_from), and the topk/aggressive
# siblings load its warmup-trials.json and reuse its pre-training student
# baseline. Run it under .wmh/distill-runs/super-anchor so the sibling paths
# resolve. Model names are the tinker-cookbook catalog names (pinned by
# test_checked_in_run_configs_resolve_cookbook_renderers).
[student]
base_model = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
lora_rank = 32

[teacher]
backend = "tinker"
model = "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16"

[harbor]
job_template = ".agents/distill/tb2-harbor-job-template.yaml"
backend = "local"
reward_key = "reward"

[rollout]
max_turns = 20
context_budget_tokens = 60000
compaction = false

# Terminus-2 cannot use the stock reasoning renderers: they hand harbor's response
# parser a LIST and kill the trial, and they strip thinking from history, which
# fragments the episode into one datum per turn. The wmh verbatim wrappers keep the
# reasoning in the token stream and the episode a single datum (wmh/distill/renderers.py).
[rollout.renderers]
"nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16" = "wmh/nemotron3_verbatim"
"nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16" = "wmh/nemotron3_ultra_verbatim"

[train]
loss = "importance_sampling"
steps = 40
tasks_per_batch = 8
group_size = 4
learning_rate = 5e-5
advantage_clip = 4.0
center_advantages = true
max_datum_tokens = 64000
sampler_refresh_every = 1
save_state_every = 4
trial_concurrency = 8

# temperature 1.0 keeps issued sampler logprobs comparable to the untempered
# teacher logprobs (unbiased reverse-KL advantages).
[sampling]
temperature = 1.0
max_tokens = 8192

# This run COLLECTS the warmup trajectories (trajectories_from is unset);
# the super-topk and super-aggressive configs load this run's manifest.
[warmup]
steps = 0

[eval]
every = 0
tasks = 12
k = 1
teacher_baseline_from = ".wmh/distill-runs/headline/evals/baseline-teacher.json"

[gate]
k = 3
min_teacher_fraction = 0.7
require_no_regression = true

[pricing]
# Ultra 64K (verified live 2026-07-23): prefill 2.49, sample 6.225 USD/Mtok.
# Cached prefill 0.498 is exactly the 20%-of-prefill default, so both cached
# rates are left implied.
teacher_prefill = 2.49
teacher_sample = 6.225
# Super rates from the Tinker models page: prefill 0.57, sample 1.44,
# train 1.276 USD/Mtok.
student_prefill = 0.57
student_sample = 1.44
student_train = 1.276

[budget]
max_usd = 500.0

[wandb]
enabled = true
project = "wmh-distill"
run_name = "distill-super-anchor"

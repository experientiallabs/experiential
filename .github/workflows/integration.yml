name: integration

# Live CLI integration walk against real providers. Runs nightly and on demand only;
# the ordinary gate excludes live tests by name.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  live-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: Live OpenAI CLI pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uv run pytest -q
          --junitxml=live-cli-evidence.xml
          wmo/cli/tests/terminal_tasks_live_pipeline_test.py
      - name: Upload live CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-cli-evidence
          path: live-cli-evidence.xml

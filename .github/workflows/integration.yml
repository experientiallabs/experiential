name: integration

# Live CLI integration walk against real providers. Runs nightly and on demand only;
# the ordinary gate excludes live tests by name.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  live-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: Live OpenAI CLI pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uv run pytest -q
          --junitxml=live-cli-evidence.xml
          wmo/cli/tests/terminal_tasks_live_pipeline_test.py
      - name: Upload live CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cli-evidence
          path: live-cli-evidence.xml

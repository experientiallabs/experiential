name: python package

on:
  pull_request:
    paths:
      - ".github/workflows/python-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "wmo/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "wmo/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distribution to PyPI"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the latest published release
        id: release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_tag="$(
            gh release view --repo "$GITHUB_REPOSITORY" \
              --json isDraft,publishedAt,tagName \
              --jq 'select(.isDraft == false and .publishedAt != null) | .tagName'
          )"
          test -n "$published_tag"
          echo "tag=$published_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', steps.release.outputs.tag) || github.ref }}
      - name: Resolve the checked-out revision
        id: source_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - name: Build the WMO distribution
        run: uv build --package world-model-optimizer --no-sources
      - name: Smoke test the wheel
        run: |
          uv venv /tmp/wmo-wheel-smoke
          uv pip install --python /tmp/wmo-wheel-smoke/bin/python dist/*.whl "openai==3.0.0"
          cd /tmp
          /tmp/wmo-wheel-smoke/bin/python - <<'PY'
          import wmo
          import wmo.common.models
          import wmo.runtime.models
          from wmo.runtime.environments import LocalProcessEnvironmentRuntime
          from wmo.runtime.openai_protocol import decode_chat, stream_encoder
          from wmo.runtime.router import RouterRuntime
          from wmo.simulation import compare_text_and_sandbox
          from wmo.simulation.engines import SandboxSimulator
          from wmo.optimize.router import RouterCompositionResult
          from wmo.simulation import SimulationSpec

          assert callable(wmo.compose_router)
          assert callable(wmo.load_project_router)
          assert callable(wmo.load_router)
          assert callable(decode_chat)
          assert callable(stream_encoder)
          assert wmo.RouterRuntime is RouterRuntime
          assert wmo.RouterCompositionResult is RouterCompositionResult
          assert "create_project_router_app" not in wmo.__all__
          assert callable(compare_text_and_sandbox)
          assert SimulationSpec.__module__ == "wmo.simulation.specs.simulation"
          assert SandboxSimulator.__module__ == "wmo.simulation.engines.sandbox"
          assert LocalProcessEnvironmentRuntime.__module__ == "wmo.runtime.environments.local"
          PY
          /tmp/wmo-wheel-smoke/bin/wmo --help
      - name: Installed-wheel no-spend release evidence
        env:
          PYTHONNOUSERSITE: "1"
          TERM: xterm-256color
          WMO_INSTALLED_RELEASE_EVIDENCE: "1"
          WMO_RELEASE_REVISION: ${{ steps.source_revision.outputs.sha }}
          WMO_SOURCE_CHECKOUT: ${{ github.workspace }}
          WMO_TELEMETRY: "0"
        run: |
          cp wmo/tests/release_test.py /tmp/wmo-wheel-smoke/installed_release_evidence.py
          cd /tmp/wmo-wheel-smoke
          ./bin/python installed_release_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI with trusted publishing
        run: uv publish --trusted-publishing always dist/*

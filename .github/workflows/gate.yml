name: gate

# Whole-repository quality, architecture, and non-live behavior gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check
      - name: non-live tests
        run: uv run pytest -q -k "not live"

name: gate

# Whole-repository quality, architecture, and non-live behavior gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check
      - name: Tinker SDK adapter tests
        run: >-
          uv run pytest -q -k "not live"
          wmo/optimize/model/sft/tinker_test.py
      - name: non-live tests
        run: >-
          uv run pytest -n 4 --dist worksteal -q -k "not live"
          wmo
          --ignore=wmo/optimize/model/sft/tinker_test.py
          --ignore=wmo/optimize/router/tests/composition_evidence_test.py
          --ignore=wmo/simulation/tests/comparison_evidence_test.py
          --deselect=wmo/tests/release_test.py::test_installed_wheel_no_spend_release_evidence

  w16-darwin-evidence:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: W16 router and bounded local-process evidence
        env:
          WMO_RELEASE_REVISION: ${{ github.sha }}
          WMO_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/w17-release-evidence
        run: >-
          uv run pytest -q
          --junitxml=w16-darwin-evidence.xml
          wmo/optimize/router/tests/composition_evidence_test.py
          wmo/simulation/tests/comparison_evidence_test.py
      - name: Upload W16 Darwin evidence result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w16-darwin-evidence
          path: |
            w16-darwin-evidence.xml
            ${{ runner.temp }}/w17-release-evidence/*.json

name: gate

# Whole-repository quality, architecture, and non-live behavior gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check
      - name: non-live tests
        # Dedicated jobs below own the expensive release and W16 evidence cases.
        run: >-
          timeout 120s uv run pytest -n 8 --dist worksteal -q -k "not live"
          --ignore=wmo/optimize/router/composition_evidence_test.py
          --ignore=wmo/simulation/comparison_evidence_test.py
          --deselect=wmo/release_test.py::test_installed_wheel_no_spend_release_evidence

  installed-wheel-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: Installed-wheel no-spend release evidence
        run: >-
          uv run pytest -q
          wmo/release_test.py::test_installed_wheel_no_spend_release_evidence

  w16-darwin-evidence:
    runs-on: macos-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: W16 router and bounded local-process evidence
        env:
          WMO_RELEASE_REVISION: ${{ github.sha }}
          WMO_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/w17-release-evidence
        run: >-
          uv run pytest -q
          --junitxml=w16-darwin-evidence.xml
          wmo/optimize/router/composition_evidence_test.py
          wmo/simulation/comparison_evidence_test.py
      - name: Upload W16 Darwin evidence result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w16-darwin-evidence
          path: |
            w16-darwin-evidence.xml
            ${{ runner.temp }}/w17-release-evidence/*.json

name: gateway latency

# Mock-isolated gateway overhead report. No paid providers and no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency:
    # Keep routine PR/push checks on the standard runner. The larger runner is
    # reserved for explicit hosted-runner comparisons so public PRs cannot
    # consume it.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'gateway-benchmark-32core' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: exp/runtime/gateway/native
      - name: Install the project and its dev extras
        run: uv sync --extra dev
      - name: Measure Experiential and LiteLLM against a local mock
        env:
          EXP_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
          LITELLM_LOG: "ERROR"
        run: >-
          uv run --with 'litellm[proxy]==1.97.0'
          python -m exp.runtime.gateway.latency_report
          --compare-litellm
          --output-json gateway-latency.json
          --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the versioned latency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gateway-latency-report
          path: gateway-latency.json
          if-no-files-found: warn
